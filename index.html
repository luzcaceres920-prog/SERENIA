<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <title>SERENIA VR - INICIO </title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://unpkg.com/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script>
<script>

  
function reproducirMusica() {
    const musica = document.querySelector("#musicaSerenia");
    musica.volume = 0.3;
    musica.loop = true;
    musica.play().catch(function(error) {
        console.log("El navegador no permitió reproducir la música:", error);
    });
}

function alternarMusica() {
    const musica = document.querySelector("#musicaSerenia");
    if (musica.paused) {
        reproducirMusica();
    } else {
        musica.pause();
    }
    actualizarTextoSonido();
}

function actualizarTextoSonido() {
    const texto = document.querySelector("#textoSonido");
    const musica = document.querySelector("#musicaSerenia");
    texto.setAttribute("value", musica.paused ? "Activar sonido" : "Desactivar sonido");
}

function mostrarFondo(idFondo) {
    document.querySelectorAll("a-sky").forEach(function (fondo) {
        fondo.setAttribute("visible", fondo.id === idFondo);
    });
}

function actualizarAccionesCursor() {
    const escena = document.querySelector("a-scene");
    const cursor = document.querySelector("a-cursor");

    document.querySelectorAll("[data-action]").forEach(function (opcion) {
        let contenedor = opcion;
        let visible = true;
        while (contenedor && contenedor !== escena) {
            const valorVisible = contenedor.getAttribute("visible");
            if (valorVisible === false || valorVisible === "false") {
                visible = false;
                break;
            }
            contenedor = contenedor.parentElement;
        }
        opcion.classList.toggle("ray-target", visible);
    });

    if (cursor.components.raycaster) {
        cursor.components.raycaster.refreshObjects();
    }
}

function mostrarRecomendacionEstresado() {
    document.querySelector("#inicio").setAttribute("visible", "false");
    document.querySelector("#recomendacionEstresado").setAttribute("visible", "true");
        document.querySelector("#recomendacionAnsiedad").setAttribute("visible", "false");
    document.querySelector("#recomendacionMCIMS").setAttribute("visible", "false");
    document.querySelector("#recomendacionSobrecargo").setAttribute("visible", "false");
        document.querySelector("#bosque").setAttribute("visible", "false");
        document.querySelector("#verano").setAttribute("visible", "false");
        actualizarAccionesCursor();
    reproducirMusica();
    actualizarTextoSonido();
}

function entrarBosque() {
    document.querySelector("#recomendacionEstresado").setAttribute("visible", "false");
    document.querySelector("#recomendacionAnsiedad").setAttribute("visible", "false");
    document.querySelector("#recomendacionMCIMS").setAttribute("visible", "false");
    document.querySelector("#recomendacionSobrecargo").setAttribute("visible", "false");  
    document.querySelector("#verano").setAttribute("visible", "false");
    document.querySelector("#bosque").setAttribute("visible", "true");
    mostrarFondo("fondoBosque");
    actualizarAccionesCursor();
    iniciarRespiracion();
}

function entrarVerano() {
    document.querySelector("#recomendacionAnsiedad").setAttribute("visible", "false");
    document.querySelector("#bosque").setAttribute("visible", "false");
    document.querySelector("#verano").setAttribute("visible", "true");
    mostrarFondo("fondoVerano");
    actualizarAccionesCursor();
}

function entrarJardin() {
    document.querySelector("#recomendacionAnsiedad").setAttribute("visible", false);
    document.querySelector("#recomendacionEstresado").setAttribute("visible", false);
    document.querySelector("#recomendacionSobrecargo").setAttribute("visible", false);
    document.querySelector("#invierno").setAttribute("visible", false);
    document.querySelector("#recomendacionMCIMS").setAttribute("visible", false);
    document.querySelector("#bosque").setAttribute("visible", false);
    document.querySelector("#verano").setAttribute("visible", false);
    document.querySelector("#invierno").setAttribute("visible", false);

    document.querySelector("#jardin").setAttribute("visible", true);

    mostrarFondo("fondoJardin");

    const video = document.querySelector("#videoJardin");
    const esfera = document.querySelector("#fondoJardin");

    esfera.setAttribute("material", {
        shader: "flat",
        src: "#videoJardin",
        side: "back"
    });

    video.play().then(function() {
        console.log("Video del jardín reproduciéndose");
    }).catch(function(error) {
        console.log("Error al reproducir el jardín:", error);
    });

    actualizarAccionesCursor();
}

function entrarinvierno() {
    document.querySelector("#recomendacionSobrecargo").setAttribute("visible", "false");
    document.querySelector("#recomendacionEstresado").setAttribute("visible", "false");
    document.querySelector("#recomendacionAnsiedad").setAttribute("visible", "false");
    document.querySelector("#recomendacionMCIMS").setAttribute("visible", "false");
    document.querySelector("#bosque").setAttribute("visible", "false");
    document.querySelector("#verano").setAttribute("visible", "false");
    document.querySelector("#jardin").setAttribute("visible", "false");
    document.querySelector("#invierno").setAttribute("visible", "true");
    mostrarFondo("fondoInvierno");
    actualizarAccionesCursor();
}
function iniciarRespiracion() {
    const instruccion = document.querySelector("#instruccionRespirar");
    instruccion.setAttribute("value", "INHALA lentamente...");
    setTimeout(function() {
        instruccion.setAttribute("value", "EXHALA lentamente...");
        setTimeout(function() {
            iniciarRespiracion();
        }, 4000);
    }, 4000);
}



function mostrarRecomendacionA() {
    document.querySelector("#inicio").setAttribute("visible", "false");
    document.querySelector("#recomendacionAnsiedad").setAttribute("visible", "true");
    document.querySelector("#recomendacionEstresado").setAttribute("visible", "false");
    document.querySelector("#recomendacionMCIMS").setAttribute("visible", "false");
    document.querySelector("#recomendacionSobrecargo").setAttribute("visible", "false");

    document.querySelector("#verano").setAttribute("visible", "false");
    actualizarAccionesCursor();

}
function mostrarRecomendacionMCIMS() {

    document.querySelector("#recomendacionAnsiedad").setAttribute("visible", "false");
    document.querySelector("#recomendacionSobrecargo").setAttribute("visible", "false");
    document.querySelector("#bosque").setAttribute("visible", "false");
    document.querySelector("#verano").setAttribute("visible", "false");
    document.querySelector("#jardin").setAttribute("visible", "false");
    document.querySelector("#invierno").setAttribute("visible", "false");
    document.querySelector("#recomendacionMCIMS").setAttribute("visible", "true");

    function mostrarRecomendacionSobrecargo() {

    document.querySelector("#verano").setAttribute("visible", "false");
    document.querySelector("#jardin").setAttribute("visible", "false");
    document.querySelector("#invierno").setAttribute("visible", "false");

function comenzarActividadVerano() {
    document.querySelector("#pantallaComenzar").setAttribute("visible", false);
    document.querySelector("#etapaVista").setAttribute("visible", true);

}
let etapaActual = 0;

function continuarVista() {

    const etapas = [
        {
            numero: "5",
            titulo: "OBSERVA TU ENTORNO",
            instruccion: "Mira a tu alrededor y reconoce 5 cosas que puedas ver."
        },
        {
            numero: "4",
            titulo: "SIENTE A TU ALREDEDOR",
            instruccion: "Reconoce 4 cosas que puedas sentir mediante el tacto."
        },
        {
            numero: "3",
            titulo: "ESCUCHA",
            instruccion: "Identifica 3 sonidos que puedas escuchar."
        },
        {
            numero: "2",
            titulo: "RECONOCE AROMAS",
            instruccion: "Identifica 2 aromas que puedas percibir."
        },
        {
            numero: "1",
            titulo: "IDENTIFICA UN SABOR",
            instruccion: "Reconoce 1 sabor que puedas percibir."
        },
        {
            numero: " ",
            titulo: "¡Has completado el recorrido!",
            instruccion: "Tomate un momento para respirar tranquilamente y reconocer como te sientes ahora."
        }
    ];

        
       if (etapaActual < 5) {
        etapaActual++;

        document.querySelector("#numeroSentido").setAttribute("value", etapas[etapaActual].numero);
        document.querySelector("#tituloSentido").setAttribute("value", etapas[etapaActual].titulo);
        document.querySelector("#instruccionSentido").setAttribute("value", etapas[etapaActual].instruccion);
    }
 
}
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll("[data-action='recomendacionEstresado']").forEach(function (opcion) {
    opcion.addEventListener("click", mostrarRecomendacionEstresado);
  });
  document.querySelectorAll("[data-action='bosque']").forEach(function (opcion) {
    opcion.addEventListener("click", entrarBosque);
  });
  document.querySelectorAll("[data-action='verano']").forEach(function (opcion) {
    opcion.addEventListener("click", entrarVerano);
  });
  document.querySelectorAll("[data-action='jardin']").forEach(function (opcion) {
    opcion.addEventListener("click", entrarJardin);
  });
  document.querySelectorAll("[data-action='invierno']").forEach(function (opcion) {
    opcion.addEventListener("click", entrarinvierno);
  });
  document.querySelectorAll("[data-action='sonido']").forEach(function (opcion) {
    opcion.addEventListener("click", alternarMusica);
  });
  document.querySelectorAll("[data-action='inicio']").forEach(function (opcion) {
    opcion.addEventListener("click", volverInicio);
  });

  const escena = document.querySelector("a-scene");
  const cursor = document.querySelector("a-cursor");
  escena.addEventListener("enter-vr", function () {
    cursor.setAttribute("cursor", "rayOrigin", "entity");
  });
  escena.addEventListener("exit-vr", function () {
    cursor.setAttribute("cursor", "rayOrigin", "mouse");
  });
  if (escena.hasLoaded) {
    actualizarAccionesCursor();
  } else {
    escena.addEventListener("loaded", actualizarAccionesCursor, { once: true });
  }
});
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll("[data-action='recomendacionAnsiedad']").forEach(function (opcion) {
    opcion.addEventListener("click", mostrarRecomendacionA);

document.addEventListener("DOMContentLoaded", function () {

document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll("[data-action='continuarVista']").forEach(function (opcion) {

function volverInicio() {
  document.querySelector("#bosque").setAttribute("visible", "false");
  document.querySelector("#verano").setAttribute("visible", "false");
  document.querySelector("#jardin").setAttribute("visible", "false");
  document.querySelector("#invierno").setAttribute("visible", "false");
  document.querySelector("#recomendacionEstresado").setAttribute("visible", "false");
  document.querySelector("#recomendacionAnsiedad").setAttribute("visible", "false");
  document.querySelector("#recomendacionMCIMS").setAttribute("visible", "false");
  document.querySelector("#recomendacionSobrecargo").setAttribute("visible", "false");
  document.querySelector("#videoJardin").pause();
  document.querySelector("#inicio").setAttribute("visible", "true");
  mostrarFondo("fondoEspacio");
    etapaActual = 0;
  document.querySelector("#pantallaComenzar").setAttribute("visible", true);
  document.querySelector("#etapaVista").setAttribute("visible", false);

  document.querySelector("#numeroSentido").setAttribute("value", "5");
  document.querySelector("#tituloSentido").setAttribute("value", "OBSERVA TU ENTORNO");
  document.querySelector("#instruccionSentido").setAttribute("value", "Mira a tu alrededor y reconoce 5 cosas que puedas ver.");
  actualizarAccionesCursor();
}
function mostrarFondo(idFondo) {
    document.querySelectorAll("a-sky, a-videosphere").forEach(function (fondo) {
        fondo.setAttribute("visible", fondo.id === idFondo);
    });
}

</script>
