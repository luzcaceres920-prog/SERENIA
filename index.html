<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SERENIA VR - INICIO </title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://unpkg.com/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script>
<script>

  
function reproducirMusica() {
    const musica = document.querySelector("#musicaSerenia");
    musica.volume = 0.3;
    musica.loop = true;
    musica.play().catch(function(error) {
        console.log("El navegador no permitió reproducir la música:", error);
    });
};

function alternarMusica() {
    const musica = document.querySelector("#musicaSerenia");
    if (musica.paused) {
        reproducirMusica();
    } else {
        musica.pause();
    }
    actualizarTextoSonido();
}

function actualizarTextoSonido() {
    const texto = document.querySelector("#textoSonido");
    const musica = document.querySelector("#musicaSerenia");
    texto.setAttribute("value", musica.paused ? "Activar sonido" : "Desactivar sonido");
}

function mostrarRecomendacionEstresado() {
    document.querySelector("#inicio").setAttribute("visible", "false");
    document.querySelector("#recomendacionEstresado").setAttribute("visible", "true");
        document.querySelector("#recomendacionAnsiedad").setAttribute("visible", "false");
    document.querySelector("#recomendacionMCIMS").setAttribute("visible", "false");
    document.querySelector("#recomendacionSobrecargo").setAttribute("visible", "false");
    reproducirMusica();
    actualizarTextoSonido();
}

function entrarBosque() {
    document.querySelector("#recomendacionEstresado").setAttribute("visible", "false");
    document.querySelector("#recomendacionAnsiedad").setAttribute("visible", "false");
    document.querySelector("#recomendacionMCIMS").setAttribute("visible", "false");
    document.querySelector("#recomendacionSobrecargo").setAttribute("visible", "false");  
    document.querySelector("#bosque").setAttribute("visible", "true");
    document.querySelector("a-sky").setAttribute("src", "#bosqueFondo");
    iniciarRespiracion();
}

function iniciarRespiracion() {
    const instruccion = document.querySelector("#instruccionRespirar");
    instruccion.setAttribute("value", "INHALA lentamente...");
    setTimeout(function() {
        instruccion.setAttribute("value", "EXHALA lentamente...");
        setTimeout(function() {
            iniciarRespiracion();
        }, 4000);
    }, 4000);
}

function mostrarRecomendacionA() {
    document.querySelector("#inicio").setAttribute("visible", "false");
    document.querySelector("#recomendacionAnsiedad").setAttribute("visible", "true");
    document.querySelector("#recomendacionEstresado").setAttribute("visible", "false");
    document.querySelector("#recomendacionMCIMS").setAttribute("visible", "false");
    document.querySelector("#recomendacionSobrecargo").setAttribute("visible", "false");
    document.querySelector("#bosque").setAttribute("visible", "false");
    reproducirMusica();
    actualizarTextoSonido();
}
function mostrarRecomendacionMCIMS() {
    document.querySelector("#inicio").setAttribute("visible", "false");
    document.querySelector("#recomendacionEstresado").setAttribute("visible", "false");
    document.querySelector("#recomendacionAnsiedad").setAttribute("visible", "false");
    document.querySelector("#recomendacionSobrecargo").setAttribute("visible", "false");
    document.querySelector("#bosque").setAttribute("visible", "false");
    document.querySelector("#recomendacionMCIMS").setAttribute("visible", "true");
}


    function mostrarRecomendacionSobrecargo() {
    document.querySelector("#inicio").setAttribute("visible", "false");
    document.querySelector("#recomendacionSobrecargo").setAttribute("visible", "true");
    document.querySelector("#recomendacionEstresado").setAttribute("visible", "false");
    document.querySelector("#recomendacionMCIMS").setAttribute("visible", "false");
    document.querySelector("#recomendacionAnsiedad").setAttribute("visible", "false");
    document.querySelector("#bosque").setAttribute("visible", "false");
    reproducirMusica();
    actualizarTextoSonido();
}

document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll("[data-action='recomendacionEstresado']").forEach(function (opcion) {
    opcion.addEventListener("click", mostrarRecomendacionEstresado);
  });
  document.querySelectorAll("[data-action='bosque']").forEach(function (opcion) {
    opcion.addEventListener("click", entrarBosque);
  });
  document.querySelectorAll("[data-action='sonido']").forEach(function (opcion) {
    opcion.addEventListener("click", alternarMusica);
  });
  document.querySelectorAll("[data-action='inicio']").forEach(function (opcion) {
    opcion.addEventListener("click", volverInicio);
  });
});
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll("[data-action='recomendacionAnsiedad']").forEach(function (opcion) {
    opcion.addEventListener("click", mostrarRecomendacionA);
  });
});
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll("[data-action='recomendacionMCIMS']").forEach(function (opcion) {
    opcion.addEventListener("click", mostrarRecomendacionMCIMS);
  });
});
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll("[data-action='recomendacionSobrecargo']").forEach(function (opcion) {
    opcion.addEventListener("click", mostrarRecomendacionSobrecargo);
  });
});



function volverInicio() {
  document.querySelector("#bosque").setAttribute("visible", "false");
  document.querySelector("#recomendacionEstresado").setAttribute("visible", "false");
  document.querySelector("#recomendacionAnsiedad").setAttribute("visible", "false");
  document.querySelector("#recomendacionMCIMS").setAttribute("visible", "false");
  document.querySelector("#recomendacionSobrecargo").setAttribute("visible", "false");
  document.querySelector("#inicio").setAttribute("visible", "true");
  document.querySelector("a-sky").setAttribute("src", "#espacio");
}



</script>
